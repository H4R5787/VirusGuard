{% extends "base.html" %}
{% block title %}Sign In · VirusGuard{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <h2 class="mb-1">Sign in</h2>
        <p class="text-secondary mb-4">Welcome back. Scan a file or check your history.</p>

        <form action="/login" method="POST" novalidate>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" name="password" required>
                    <button class="btn btn-outline-light" type="button" id="togglePassword" aria-label="Show password">
                        <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>
            <div class="d-flex justify-content-between mb-3">
                <a href="#" class="small text-secondary" tabindex="-1" aria-disabled="true" title="Not built yet">Forgot password?</a>
                <a href="/Register" class="small">Create an account</a>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign in</button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('togglePasswordIcon');
    toggleBtn.addEventListener('click', function () {
        const isHidden = passwordInput.type === 'password';
        passwordInput.type = isHidden ? 'text' : 'password';
        toggleIcon.classList.toggle('fa-eye');
        toggleIcon.classList.toggle('fa-eye-slash');
        toggleBtn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    });
</script>
{% endblock %}
